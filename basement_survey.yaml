basement_survey:
  metadata:
    project_name: "Schimbare Coloană Apă Rece - Scara [NUMĂRUL_SCĂRII]"
    address: "București, [ADRESA_EXACTĂ]"
    survey_date: "2024-01-XX"
    surveyor: "[NUMELE_TĂU]"
    scale: "1:50"  # sau alta
    coordinate_system: "Local basement grid"
    reference_point: 
      description: "Colțul stânga-jos al subsolului"
      coordinates: [0, 0, 0]  # x, y, z

  layers:
    layer_0_basement_plan:
      name: "Layer 0 - Plan Releveu Subsol"
      description: "Plan arhitectural al subsolului - fără diametru specific"
      color: "#000000"  # Negru
      type: "architectural_reference"
      
      elements:
        basement_outline:
          - id: "perimeter_wall"
            type: "wall"
            points: [[0, 0], [16, 0], [16, 10], [0, 10], [0, 0]]
            notes: "Perimetrul subsolului"
            
        structural_elements:
          - id: "pillar_1"
            type: "pillar"
            center: [4, 3]
            dimensions: [0.4, 0.4]
            
          - id: "pillar_2" 
            type: "pillar"
            center: [12, 3]
            dimensions: [0.4, 0.4]
            
        stair_locations:
          - id: "scara_1"
            type: "staircase"
            center: [2, 5]
            dimensions: [2, 3]
            serves: "Scara 1"
            
          - id: "scara_2"
            type: "staircase"
            center: [8, 5]
            dimensions: [2, 3]
            serves: "Scara noastră"
            
          - id: "scara_3"
            type: "staircase"
            center: [14, 5]
            dimensions: [2, 3]
            serves: "Scara 3"

    layer_1_common_between_stairs:
      name: "Layer 1 - Țeavă Comună între Scări"
      description: "Distribuție comună pentru toate scările"
      color: "#FF0000"  # Roșu
      diameter: 110  # mm
      material: "oțel_galvanizat"
      installation_year: "1985"
      condition: "corodată_mediu"
      
      segments:
        - id: "main_supply"
          start_point: [0, 1, -2.5]
          end_point: [16, 1, -2.5]
          length: 16.0
          notes: "Alimentare principală din stradă"
          
        - id: "distribution_branch"
          start_point: [8, 1, -2.5]
          end_point: [8, 9, -2.5]
          length: 8.0
          notes: "Ramura de distribuție către scări"
          
      connection_points:
        - id: "connection_stair_1"
          coordinates: [2, 1, -2.5]
          type: "T_junction"
          diameter_out: 75
          serves: "Scara 1"
          
        - id: "connection_our_stair"
          coordinates: [8, 1, -2.5]
          type: "T_junction"
          diameter_out: 75
          serves: "Scara noastră"
          
        - id: "connection_stair_3"
          coordinates: [14, 1, -2.5]
          type: "T_junction"
          diameter_out: 75
          serves: "Scara 3"

    layer_2_our_stair_pipe:
      name: "Layer 2 - Țeavă Scării Noastre"
      description: "Distribuție specifică pentru scara noastră"
      color: "#0000FF"  # Albastru
      diameter: 75  # mm
      material: "oțel_galvanizat"
      installation_year: "1985"
      condition: "corodată_grav"
      
      segments:
        - id: "stair_main_horizontal"
          start_point: [8, 1, -2.5]  # din layer 1
          end_point: [8, 7, -2.5]
          length: 6.0
          notes: "Segment principal orizontal"
          
        - id: "stair_secondary_branch"
          start_point: [8, 5, -2.5]
          end_point: [11, 5, -2.5]
          length: 3.0
          notes: "Ramură secundară către coloanele din fund"
          
      connection_points:
        - id: "vertical_column_A"
          coordinates: [8, 3, -2.5]
          type: "vertical_takeoff"
          diameter_out: 50
          serves_apartments: ["1A", "2A", "3A", "4A"]
          column_id: "A"
          
        - id: "vertical_column_B"
          coordinates: [8, 6, -2.5]
          type: "vertical_takeoff"
          diameter_out: 50
          serves_apartments: ["1B", "2B", "3B", "4B"]
          column_id: "B"
          
        - id: "vertical_column_C"
          coordinates: [11, 5, -2.5]
          type: "vertical_takeoff"
          diameter_out: 50
          serves_apartments: ["1C", "2C", "3C", "4C"]
          column_id: "C"

    layer_3_drainage_to_stair:
      name: "Layer 3 - Scurgeri la Țeava Scării"
      description: "Conectările verticale către țeava scării noastre"
      color: "#00FF00"  # Verde
      diameter: 50  # mm
      material: "oțel_galvanizat"
      installation_year: "1985"
      condition: "variabilă"
      
      vertical_connections:
        - id: "column_A_vertical"
          name: "Coloana A - Verticală"
          start_point: [8, 3, -2.5]
          end_point: [8, 3, 0.0]  # până la parter
          length: 2.5
          serves_apartments: ["1A", "2A", "3A", "4A"]
          condition: "corodată_mediu"
          priority: 2
          
        - id: "column_B_vertical"
          name: "Coloana B - Verticală"
          start_point: [8, 6, -2.5]
          end_point: [8, 6, 0.0]
          length: 2.5
          serves_apartments: ["1B", "2B", "3B", "4B"]
          condition: "critică"
          priority: 1
          notes: "Necesită înlocuire urgentă - presiune scăzută"
          
        - id: "column_C_vertical"
          name: "Coloana C - Verticală"
          start_point: [11, 5, -2.5]
          end_point: [11, 5, 0.0]
          length: 2.5
          serves_apartments: ["1C", "2C", "3C", "4C"]
          condition: "bună"
          priority: 3

  additional_infrastructure:
    valves:
      - id: "vana_principală"
        coordinates: [0.5, 0, -2.5]
        type: "vana_sferică"
        diameter: 110
        condition: "funcțională"
        
      - id: "vana_scară"
        coordinates: [10.8, 0.5, -2.5]
        type: "vana_fluture"
        diameter: 75
        condition: "blocată"
        
    support_points:
      - coordinates: [5.0, 0, -2.5]
        type: "suport_metalic"
        condition: "corodat"
        
      - coordinates: [10.8, 3.0, -2.5]
        type: "clemă_fixare"
        condition: "bună"
        
    obstacles:
      - coordinates: [7.5, 2.0, -2.0]
        type: "coloană_electrică"
        dimensions: [0.3, 0.3, 2.5]
        notes: "Necesită ocolire"
        
  technical_notes:
    pressure_issues:
      - location: "coloana_B"
        description: "Presiune scăzută la etajele superioare"
        severity: "critică"
        
    corrosion_points:
      - location: "DN75_01"
        description: "Coroziune avansată la raccordul cu DN110"
        action_required: "înlocuire_completă"
        
  replacement_plan:
    priority_order:
      1: "DN75_stair_distribution"
      2: "DN50_coloana_B"
      3: "DN50_coloana_A"
      
    new_materials:
      DN75: "PPR_PN20"
      DN50: "PPR_PN20"
      
    estimated_costs:
      materials: 2500  # RON
      labor: 3500      # RON
      permits: 500     # RON
      total: 6500      # RON

  photos:
    - filename: "basement_overview_01.jpg"
      coordinates: [8.0, 3.0, -1.0]
      direction: "nord"
      description: "Vedere generală subsol"
      
    - filename: "DN75_corrosion_01.jpg"
      coordinates: [10.8, 1.0, -2.5]
      description: "Coroziune gravă pe DN75"
      
  measurements_log:
    - timestamp: "2024-01-XX 10:00"
      measurer: "[NUMELE_TĂU]"
      instrument: "ruletă_laser_50m"
      accuracy: "±2mm"
      
    - verification_required: true
      next_survey_date: "2024-01-XX"